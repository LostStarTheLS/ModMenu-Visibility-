plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/iris.accesswidener")
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // Minecraft 1.21.11 and Yarn Mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Public GUI Library: Cloth Config (21.11.x for Minecraft 1.21.11)
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Jar-in-Jar (JiJ): Bundles Cloth Config inside META-INF/jars of the built mod JAR
    include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")

    // Mod Menu Integration (17.0.x for Minecraft 1.21.11)
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def modVersion = project.version
    def mcVersion = project.minecraft_version
    def loaderVersion = project.loader_version

    inputs.property "version", modVersion
    inputs.property "minecraft_version", mcVersion
    inputs.property "loader_version", loaderVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion,
                "minecraft_version": mcVersion,
                "loader_version": loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def archivesName = project.base.archivesName.get()
    inputs.property "archivesName", archivesName

    from("LICENSE") {
        rename { "${it}_${archivesName}" }
    }
}
